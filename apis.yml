aid: halia-therapeutics
name: Halia Therapeutics
description: 'Halia Therapeutics, Inc. is a privately held clinical-stage biopharmaceutical
  company headquartered in Lehi, Utah, founded in 2017 and led by CEO Dr. David Bearss. Halia
  discovers and develops small-molecule therapies that target the immune system''s inflammatory
  response — chiefly allosteric NEK7/NLRP3 inflammasome inhibition and LRRK2 inhibition — to
  resolve the chronic inflammation that drives hematologic, metabolic and neurodegenerative
  disease. Its lead clinical program, ofirnoflast (HT-6184), holds FDA Fast Track and Orphan Drug
  designation for lower-risk myelodysplastic syndromes; HT-4253, an LRRK2 inhibitor aimed at
  neuroinflammation and Alzheimer''s prevention in APOE4 carriers, has completed a first-in-human
  Phase 1 study. The company also markets a "genetic resilience" research platform (GENMOR) built
  on family-cohort genomics. Halia is a drug developer, not a software vendor: it publishes a
  Webflow corporate site with pipeline, platform and press pages, and no developer program,
  public API, SDK or machine-readable specification of any kind.'
